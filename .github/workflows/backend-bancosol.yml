name: Backend Bancosol CI

on:
  push:
    paths:
      - 'Backend1/Bancosol/**'
  pull_request:
    paths:
      - 'Backend1/Bancosol/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 23
      uses: actions/setup-java@v4
      with:
        java-version: '23'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build with Maven
      run: |
        cd Backend1/Bancosol
        chmod +x mvnw
        ./mvnw clean compile
