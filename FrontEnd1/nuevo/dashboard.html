<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bancosol - Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <script src="js/main.js" defer></script>
    <script src="js/custom_element/custom_element.js" defer></script>
    <script src="js/dashboard.js" type="module"></script>
</head>
<body>
    <include-html src="custom_elementsHTML/aside_bancosol.html"></include-html>

    <main class="main-content">
        <header class="header">
            <h1>Cuadro de Mando</h1>
            <span>Bienvenido, Administrador</span>
        </header>
        <div class="dashboard-grid">
            <div class="card dashboard-card">
                <h3>Total de Tiendas</h3>
                <div class="dashboard-number" id="metric-total-tiendas">-</div>
                <p class="dashboard-label">Tiendas registradas</p>
            </div>

            <div class="card dashboard-card">
                <h3>Total de Voluntarios Movilizados</h3>
                <p class="dashboard-number blue" id="metric-total-voluntarios">-</p>
                <p class="dashboard-label">voluntarios registrados</p>
            </div>

            <div class="card">
                <h3>Top Cadenas Participantes</h3>
                <table class="dashboard-table">
                    <thead>
                        <tr>
                            <th>Cadena</th>
                            <th>Tiendas</th>
                        </tr>
                    </thead>
                    <tbody id="metric-top-cadenas-tbody">
                    </tbody>
                </table>
            </div>

            <div class="card dashboard-card">
                <h3>Días restantes</h3>
                <p class="dashboard-number blue" id="metric-days-remaining">-</p>
                <p class="dashboard-label" id="metric-days-label">Cargando...</p>
            </div>
        </div>
    </main>

    
</body>
</html>
