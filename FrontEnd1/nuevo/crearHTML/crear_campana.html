<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bancosol - Campañas - Crear</title>
    <link rel="stylesheet" href="../formulario.css">
    <link rel="icon" type="image/png" href="/assets/BANCOSOL_ICONO.png">
    <script src="../js/main.js" defer></script>
    <script src="../js/crearJS/crear_campana.js" type="module"></script>
</head>
<body>
    <header>
        <h1>Crear Campaña</h1>
    </header>

    <div class="formulario">
        <form>
            <div class="form-group">
                <label for="nombre">Nombre<span class="required">*</span></label>
                <input type="text" name="nombre" id="nombre" required/>
            </div>
            <div class="form-group">
                <label for="ano">Año<span class="required">*</span></label>
                <input type="number" name="ano" id="ano" required/>
            </div>
            <div class="form-group">
                <label for="dia_comienzo">Fecha de Inicio<span class="required">*</span></label>
                <input type="date" name="dia_comienzo" id="dia_comienzo" required/>
            </div>
            <div class="form-group">
                <label for="dia_final">Fecha de Fin<span class="required">*</span></label>
                <input type="date" name="dia_final" id="dia_final" required/>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Crear Campaña</button>
                <button type="button" class="btn btn-secondary" onclick="history.back()">Cancelar</button>
            </div>
        </form>
    </div>
</body>
</html>
