<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bancosol - Tiendas - Crear</title>
    <link rel="stylesheet" href="../formulario.css">
    <script src="../js/main.js" defer></script>
    <script src="../js/crearJS/crear_tienda.js" type="module"></script>
</head>
<body>
    <header>
        <h1>Crear Tienda</h1>
    </header>

    <div class="formulario">
        <form>
            <div class="form-group">
                <label for="cadena">Cadena<span class="required">*</span></label>
                <select name="cadena[]" id="cadena" required>
                    <option value="">-- Seleccione una cadena --</option>
                </select>
            </div>
            <div class="form-group">
                <label for="descripcion">Especificación<span class="required">*</span></label>
                <input type="text" name="descripcion" id="descripcion" required/>
            </div>
            <div class="form-group">
                <label for="Localidad">Localidad<span class="required">*</span></label>
                <input type="text" name="Localidad" id="Localidad" required/>
            </div>
            <div class="form-group">
                <label for="domicilio">Domicilio<span class="required">*</span></label>
                <input type="text" name="domicilio" id="domicilio" required/>
            </div>
            <div class="form-group">
                <label for="CPostal">Código Postal<span class="required">*</span></label>
                <input type="text" name="CPostal" id="CPostal" required/>
            </div>
            <div class="form-group">
                <label for="ZGeo">Zona Geográfica<span class="required">*</span></label>
                <input type="text" name="ZGeo" id="ZGeo" required/>
            </div>
            <div class="form-group">
                <label for="capitan">Capitán</label>
                <select name="capitan" id="capitan">
                    <option value="">-- Seleccione una cadena --</option>
                </select>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Crear Tienda</button>
                <button type="button" class="btn btn-secondary" onclick="history.back()">Cancelar</button>
            </div>
        </form>
    </div>
</body>
