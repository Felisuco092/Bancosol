<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bancosol - Turnos - Crear</title>
    <link rel="stylesheet" href="../formulario.css">
    <script src="../js/main.js" defer></script>
    <script src="../js/crearJS/crear_turno.js" type="module"></script>
</head>
<body>
    <header>
        <h1>Crear Turno</h1>
    </header>

    <div class="formulario">
        <form>
            <div class="form-group">
                <label for="campana">Campaña<span class="required">*</span></label>
                <select name="campana" id="campana" required>
                    <option value="">-- Seleccione una campaña --</option>
                </select>
            </div>
            <div class="form-group">
                <label for="tienda">Tienda<span class="required">*</span></label>
                <select name="tienda" id="tienda" required>
                    <option value="">-- Seleccione una tienda --</option>
                </select>
            </div>
            <div class="form-group">
                <label for="voluntario">Voluntario<span class="required">*</span></label>
                <select name="voluntario" id="voluntario" required>
                    <option value="">-- Seleccione un voluntario --</option>
                </select>
            </div>
            <div class="form-group">
                <label for="dia">Día<span class="required">*</span></label>
                <input type="date" name="dia" id="dia" required/>
            </div>
            <div class="form-group">
                <label for="hora_inicio">Hora de Inicio<span class="required">*</span></label>
                <input type="time" name="hora_inicio" id="hora_inicio" required/>
            </div>
            <div class="form-group">
                <label for="hora_fin">Hora de Fin<span class="required">*</span></label>
                <input type="time" name="hora_fin" id="hora_fin" required/>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Crear Turno</button>
                <button type="button" class="btn btn-secondary" onclick="history.back()">Cancelar</button>
            </div>
        </form>
    </div>
</body>
</html>
