<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bancosol - Campañas</title>
    <link rel="stylesheet" href="styles.css">
    <script src="js/main.js" defer></script>
    <script src="js/custom_element/custom_element.js" defer></script>
    <script src="js/campanas.js" type="module" ></script>
</head>
<body>
    <include-html src="custom_elementsHTML/aside_bancosol.html"></include-html>

    <main class="main-content">
        <header class="header">
            <h1>Gestión de Campañas</h1>
            <button class="btn btn-primary" onclick="window.location.href = 'crearHTML/crear_campana.html'">+ Nueva Campaña</button>
        </header>

<div class="card filtros-campanas">
            <button class="btn filter-btn active" data-filter="all">Todas</button>
            <button class="btn filter-btn" data-filter="activa">Activas</button>
            <button class="btn filter-btn" data-filter="terminada">Terminadas</button>
            <button class="btn filter-btn" data-filter="proximamente">Próximamente</button>
        </div>

        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th><b>Nombre de Campaña</b></th>
                        <th><b>Año</b></th>
                        <th><b>Inicio</b></th>
                        <th><b>Fin</b></th>
                        <th><b>Estado</b></th>
                        <th><b>Acciones</b></th>
                    </tr>
                </thead>
                <tbody id="campaign-table-body">
                    
                </tbody>
            </table>
        </div>
    </main>

    

</body>
</html>
