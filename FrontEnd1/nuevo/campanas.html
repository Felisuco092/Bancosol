<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bancosol - Campañas</title>
    <link rel="stylesheet" href="styles.css">
    <script src="js/main.js" defer></script>
    <script src="js/campanas.js" type="module" ></script>
</head>
<body>
    <button id="btn-desplegable" class="btn btn-primary btn-collapsible">
        ☰
    </button>
    <aside class="sidebar">
        <img src="./assets/LOGO_BANCOSOL.png" alt="Logo BANCOSOL" class="logo_login">
        <nav id="menu-enlaces">
            <ul>
                <li><a href="dashboard.html" >Cuadro de Mando</a></li>
                <li><a href="campanas.html" class="active">Gestión de Campañas</a></li>
                <li><a href="tiendas.html">Gestión de Tiendas</a></li>
                <li><a href="colaboradores.html">Colaboradores</a></li>
                <li><a href="usuarios.html">Usuarios</a></li>
                <li><a href="turnos.html">Asignación de Turnos</a></li>
                <li><a href="bandeja.html">Bandeja de Entrada</a></li>
                <li><a href="#" id="logout-btn" class="text-logout">Cerrar Sesión</a></li>
            </ul>
        </nav>
    </aside>

    <main class="main-content">
        <header class="header">
            <h1>Gestión de Campañas</h1>
            <button class="btn btn-primary">+ Nueva Campaña</button>
        </header>

<div class="card filtros-campanas">
            <button class="btn filter-btn active" data-filter="all">Todas</button>
            <button class="btn filter-btn" data-filter="activa">Activas</button>
            <button class="btn filter-btn" data-filter="terminada">Terminadas</button>
            <button class="btn filter-btn" data-filter="proximamente">Próximamente</button>
        </div>

        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>Nombre de Campaña</th>
                        <th>Año</th>
                        <th>Inicio</th>
                        <th>Fin</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="campaign-table-body">
                    
                </tbody>
            </table>
        </div>
    </main>

    

</body>
</html>
