<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bancosol - Campañas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <aside class="sidebar">
        <h2>Bancosol</h2>
        <nav>
            <ul>
                <li><a href="dashboard.html">Cuadro de Mando</a></li>
                <li><a href="campanas.html" class="active">Gestión de Campañas</a></li>
                <li><a href="tiendas.html">Gestión de Tiendas</a></li>
                <li><a href="colaboradores.html">Colaboradores</a></li>
                <li><a href="usuarios.html">Usuarios</a></li>
                <li><a href="turnos.html">Asignación de Turnos</a></li>
                <li><a href="bandeja.html">Bandeja de Entrada</a></li>
                <li><a href="#" id="logout-btn" style="color: #ff6b6b;">Cerrar Sesión</a></li>
            </ul>
        </nav>
    </aside>

    <main class="main-content">
        <header class="header">
            <h1>Gestión de Campañas</h1>
            <button class="btn btn-primary">+ Nueva Campaña</button>
        </header>

        <div class="card">
            <h3>Nueva Campaña (Referencia PDF pág. 2)</h3>
            <form>
                <div style="margin-bottom: 15px;">
                    <label>Nombre de la Campaña:</label>
                    <input type="text" placeholder="Ej: Gran Recogida" style="width: 100%; padding: 8px;">
                </div>
                <div style="margin-bottom: 15px;">
                    <label>Año:</label>
                    <select style="width: 100%; padding: 8px;">
                        <option>2026</option>
                        <option>2025</option>
                    </select>
                </div>
                <div style="margin-bottom: 15px;">
                    <label>Cadenas de Supermercados que participan:</label>
                    <div style="margin-top: 10px;">
                        <input type="checkbox"> Mercadona
                        <input type="checkbox" style="margin-left: 20px;"> Carrefour
                        <input type="checkbox" style="margin-left: 20px;"> Lidl
                        <input type="checkbox" style="margin-left: 20px;"> Dia
                    </div>
                </div>
                <button type="submit" class="btn btn-success">Guardar Campaña</button>
            </form>
        </div>
    </main>

    <script src="main.js"></script>
</body>
</html>
