<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bancosol - Tiendas</title>
    <link rel="stylesheet" href="styles.css">
    <script src="js/tiendas.js" type="module"></script>
    <script src="js/main.js" defer></script>
    <script src="js/custom_element/custom_element.js" defer></script>
</head>
<body>
    <include-html src="custom_elementsHTML/aside_bancosol.html"></include-html>

    <main class="main-content">
        <header class="header">
            <h1>Gestión de Tiendas</h1>
            <button class="btn btn-primary" onclick="location.href='./crearHTML/crear_tienda.html'">+ Nueva Tienda</button>
        </header>

        <div class="card">
            <div class="filtros-grid">
                <div>
                    <label for="select-filtro-campanas">Campaña:</label>
                    <select id="select-filtro-campanas">
                        <option value="">Seleccionar Campaña...</option>
                    </select>
                </div>
                <div>
                    <label for="filtro-por-cadenas">Cadena:</label>
                    <select id="filtro-por-cadenas">
                        <option value="todas">Seleccionar Cadena...</option>
                    </select>
                </div>
                <div>
                    <label for="filtro-por-localidad">Localidad:</label>
                    <select id="filtro-por-localidad">
                        <option value="todas">Seleccionar Localidad...</option>
                    </select>
                </div>
            </div>

            <div id="tiendas-placeholder" class="card" style="text-align: center; padding: 2rem; color: #666;">
                Seleccione una campaña para visualizar las tiendas
            </div>

            <table id="tabla-tiendas" class="tabla-tiendas" style="display: none;">
                <thead>
                    <tr>
                        <th>Tienda</th>
                        <th>Participación</th>
                        <th>Localidad</th>
                        <th>Domicilio</th>
                        <th>C.P.</th>
                        <th>Zona</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-tiendas-body">
                    
                </tbody>
            </table>
        </div>
    </main>

    
</body>
</html>
