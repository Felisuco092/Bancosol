<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bancosol - Asignación de Turnos</title>
    <link rel="stylesheet" href="styles.css">
    <script src="js/main.js" defer></script>
    <script src="js/turnos.js" type="module"></script>
</head>
<body>
    <button id="btn-desplegable" class="btn btn-primary btn-collapsible">
        ☰
    </button>
    <aside class="sidebar">
        <img src="./assets/LOGO_BANCOSOL.png" alt="Logo BANCOSOL" class="logo_login">
        <nav id="menu-enlaces">
            <ul>
                <li><a href="dashboard.html" >Cuadro de Mando</a></li>
                <li><a href="campanas.html">Gestión de Campañas</a></li>
                <li><a href="tiendas.html">Gestión de Tiendas</a></li>
                <li><a href="colaboradores.html">Colaboradores</a></li>
                <li><a href="usuarios.html">Usuarios</a></li>
                <li><a href="turnos.html" class="active">Asignación de Turnos</a></li>
                <li><a href="bandeja.html">Bandeja de Entrada</a></li>
                <li><a href="#" id="logout-btn" class="text-logout">Cerrar Sesión</a></li>
            </ul>
        </nav>
    </aside>

    <main class="main-content">
        <header class="header">
            <h1>Asignación de Turnos</h1>
        </header>

        <div class="card filtros-turnos">
                <div>
                    <label for="select-campana">Campaña:</label>
                    <select id="select-campana">
                        <option value="">-- Seleccione Campaña --</option>
                    </select>
                </div>
                <div>
                    <label for="select-tienda">Tienda:</label>
                    <select id="select-tienda">
                        <option value="">-- Seleccione Tienda --</option>
                    </select>
                </div>
                <button id="btn-buscar" class="btn btn-primary">Ver Cuadrante</button>
            </div>
        </div>

        <div id="cuadrante-container" style="display: none;">
            <div class="card">
                <div class="cuadrante-header">
                    <h3>Cuadrante de Turnos</h3>
                    <div class="cuadrante-actions">
                        <span>Capitán: <strong id="capitan-nombre">-</strong></span>
                        <button class="btn btn-success btn-add-extra">+ Añadir Turno Extra</button>
                    </div>
                </div>
                
                <table class="cuadrante-tabla">
                    <thead>
                        <tr>
                            <th>Día</th>
                            <th>Inicio</th>
                            <th>Fin</th>
                            <th>Voluntarios Asignados</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-turnos-body">
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</body>
</html>
