<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bancosol - Cadenas</title>
    <link rel="stylesheet" href="styles.css">
    <script src="js/main.js" defer></script>
    <script src="js/custom_element/custom_element.js" defer></script>
    <script src="js/cadenas.js" type="module" ></script>
    
</head>
<body>
    <include-html src="custom_elementsHTML/aside_bancosol.html"></include-html>

<main class="main-content">
    <header class="header">
        <h1>Cadenas</h1>
        <button class="btn btn-primary" onclick="location.href='crear_tienda.html'">+ Nueva Cadena</button>
    </header>
        
    <div class="card">
        <div class="filtros-grid">
            <div>
                <label for="select-filtro-campanas">Campaña:</label>
                <select id="select-filtro-campanas">
                    <option value="">Seleccionar Campaña...</option>
                </select>
            </div>
            <div class="filtros-cadenas">
                <label>Mostrar:</label>
                <div class="btn-group">
                    <button class="btn filter-btn active" data-filter="all">Todas</button>
                    <button class="btn filter-btn" data-filter="activa">Activas</button>
                </div>
            </div>
        </div>

        <div id="cadenas-placeholder" class="text-center" style="padding: 2rem; color: #666;">
            Seleccione una campaña para visualizar las cadenas
        </div>

        <table id="tabla-cadenas" class="tabla-cadenas" style="display: none;">
            <thead>
                <tr>
                    <th>Nombre de Cadena</th>
                    <th>Estado Participación</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="chain-table-body">
                
            </tbody>
        </table>
    </div>


    </main>
</body>
</html>
